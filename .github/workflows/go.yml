name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install deps
        run: go mod tidy

      - name: Run tests
        run: go test ./... -cover

      - name: Build
        run: go build -o bin/url-shortener ./cmd/server
