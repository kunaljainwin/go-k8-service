---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-go-service
  namespace: production
  labels: 
    app: go-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
        - name: go-service
          image: kunaljainwindock/go-service:latest
          ports: 
            - containerPort: 8080
          resources: 
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe: 
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: 
              path: /api/v1/readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
